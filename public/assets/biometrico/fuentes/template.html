<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Animación biométrica · Isométrica 3D</title>
<style>
html.transparent{background:transparent}
#fallback:not([hidden]){display:block;width:100%;height:100%;object-fit:contain}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#c6d7e0}body.transparent{background:transparent}#biometric{position:relative;width:100%;height:100%;min-height:240px;isolation:isolate}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.14em;color:#6d9baa}.tools{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;opacity:0;transition:opacity .25s;z-index:2;padding:0 12px}body:hover .tools,.tools:focus-within{opacity:1}button{background:rgba(16,26,36,.93);border:1px solid #2c3b48;color:#b8cdd7;font:12px Arial,sans-serif;line-height:1.3;border-radius:20px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(12px)}button:hover{color:#e6fcff;border-color:#567b8c}button:focus-visible{outline:2px solid #71ebff;outline-offset:4px}.embedded .tools,.embedded .credit{display:none}.credit{position:absolute;bottom:70px;left:0;right:0;text-align:center;color:#586f7d;font-size:10px;letter-spacing:.17em;pointer-events:none;opacity:0;transition:opacity .25s}body:hover .credit{opacity:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(hover:none){.tools{opacity:1;bottom:12px}button{padding:9px 11px;font-size:11px}.credit{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="biometric"><div id="loading">PREPARANDO ANIMACIÓN</div><img id="fallback" hidden src="data:image/png;base64,/*__POSTER__*/" alt="Terminal biométrico isométrico, rostro poligonal y confirmación verde."></main>
<div class="credit" aria-hidden="true">BIOMETRIC IDENTITY · ISOMETRIC 3D</div>
<div class="tools" aria-label="Controles de la animación">
<button id="play" type="button" aria-pressed="false">Pausar</button>
<button id="restart" type="button">Reiniciar</button>
<button id="background" type="button">Fondo transparente</button>
<button id="save-png" type="button">Guardar PNG</button>
</div>
<p id="state" class="sr-only">Sistema listo</p>
<noscript><style>#fallback{display:block!important;width:100%;height:100%;object-fit:contain}#loading,.tools,.credit{display:none!important}</style></noscript>
<script>/*__THREE__*/</script>
<script>/*__FACE__*/</script>
<script>/*__SCENE__*/</script>
</body>
</html>
